<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/logo/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/logo/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <button class="menu-toggle" aria-label="Menu" onclick="document.body.classList.toggle('nav-open')">☰</button>
    <a class="brand" href="{{ '/' | relative_url }}">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="{{ '/assets/logo/beanquery-logo-dark.svg' | relative_url }}">
        <img src="{{ '/assets/logo/beanquery-logo.svg' | relative_url }}" alt="beanquery" height="32">
      </picture>
    </a>
    <a class="repo" href="{{ site.repo_url }}">GitHub ↗</a>
  </header>

  <div class="layout">
    <nav class="sidebar">
      {% for group in site.data.nav %}
      <div class="nav-group">{{ group.title }}</div>
      <ul>
        {% for item in group.items %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
      {% endfor %}
    </nav>

    <main class="content">
      {% if page.title and page.url != "/" %}<h1>{{ page.title }}</h1>{% endif %}
      {{ content }}
      <footer>
        Apache License 2.0 · <a href="{{ site.repo_url }}">mszajner/beanquery</a> ·
        <a href="{{ site.repo_url }}/edit/main/docs/{{ page.path }}">Edit this page</a>
      </footer>
    </main>
  </div>
</body>
</html>
