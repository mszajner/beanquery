name: Release

# Publishes to Maven Central when a version tag is pushed (e.g. v0.1.0).
# The tag must match the <version> already committed in the POMs (without -SNAPSHOT).
#
# Required repository secrets:
#   CENTRAL_USERNAME     - Central Portal token username
#   CENTRAL_PASSWORD     - Central Portal token password
#   GPG_PRIVATE_KEY      - ASCII-armored private key ( gpg --armor --export-secret-keys KEYID )
#   GPG_PASSPHRASE       - passphrase for that key

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify tag matches project version
        run: |
          VERSION="$(./mvnw -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "project version: $VERSION / tag: $TAG"
          test "$VERSION" = "$TAG" || { echo "::error::tag $GITHUB_REF_NAME does not match project version $VERSION"; exit 1; }
          case "$VERSION" in *-SNAPSHOT) echo "::error::refusing to release a SNAPSHOT"; exit 1;; esac

      - name: Deploy
        run: ./mvnw -B -ntp -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
